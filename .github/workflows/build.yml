name: Build APK

# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0-alpha.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          APK="Anukalpa-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --prerelease --title "anukalpa $TAG" \
              --notes "Test build for Android (debug-signed). Web version: https://falakpat3l.github.io/anukalpa/" \
              --target "$GITHUB_SHA"
          fi
