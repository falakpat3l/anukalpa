name: Build APK

# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0-alpha.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["chore/**", "fix/**"] # test builds: build only, nothing is published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build small test APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Keep the test APK (branches only)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish pre-release with the APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          APK="Anukalpa-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --prerelease --title "anukalpa $TAG" \
              --notes "Test build for Android (debug-signed). Web version: https://falakpat3l.github.io/anukalpa/" \
              --target "$GITHUB_SHA"
          fi
