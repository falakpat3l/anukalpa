name: Build APK

# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0-alpha.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["chore/**", "fix/**"] # test builds: build only, nothing is published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the APK and the Play bundle (.aab)
        shell: bash
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            # Only this user can read the key file. It is never printed.
            ( umask 077; printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks" )
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Keep the test APK (branches only)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
      - name: Publish pre-release with the APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          APK="Anukalpa-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          AAB="${APK%.apk}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --prerelease --title "anukalpa $TAG" \
              --notes "Test build for Android. Web version: https://falakpat3l.github.io/anukalpa/" \
              --target "$GITHUB_SHA"
          fi
